<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>smoke</title>
  <style>
    html, body { margin: 0; padding: 0; background: #123456; color: #fff;
      font: 16px/1.5 -apple-system, system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; height: 100vh; }
    .top { padding: 14px 16px; background: #123456; font-weight: 600; }
    .list { flex: 1 1 auto; overflow-y: auto; padding: 8px 16px 90px; }
    .row { background: #1b4064; border-radius: 10px; padding: 12px; margin: 8px 0; }
    .composer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px;
      background: #123456; display: flex; gap: 8px; }
    input[type=text] { flex: 1; height: 42px; border-radius: 21px; border: 0;
      padding: 0 16px; font-size: 15px; }
    button { width: 78px; height: 42px; border-radius: 21px; border: 0;
      background: #4d6bfe; color: #fff; font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">SMOKE TEST</div>
    <div class="list" id="list"></div>
    <div class="composer">
      <input id="msg" type="text" placeholder="输入框" />
      <button id="send">发送</button>
    </div>
  </div>
  <script>
    var list = document.getElementById('list');
    for (var i = 1; i <= 40; i++) {
      var d = document.createElement('div');
      d.className = 'row';
      d.textContent = '消息 #' + i + ' —— 用来测试滚动与键盘是否正常';
      list.appendChild(d);
    }
    // 通知链路自测：收到 turn/end 时让注入脚本识别（仅用于日志）
    document.getElementById('send').addEventListener('click', function () {
      var t = document.createElement('div');
      t.className = 'row';
      t.textContent = '已发送：' + document.getElementById('msg').value;
      list.appendChild(t);
      list.scrollTop = list.scrollHeight;
    });
  </script>
</body>
</html>
